<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vivo Sales Dashboard</title>
<style>
/* =========================================================
   ダッシュボード部分 (やさしい配色)
   ========================================================= */
:root {
  color-scheme: light;
  --page: #f6f5f1;
  --surface: #fdfdfb;
  --surface-2: #f1f0eb;
  --ink: #23262b;
  --ink-2: #555a61;
  --muted: #8a8c8f;
  --line: #e4e2da;
  --line-strong: #cfcdc4;
  --accent: #3b82c4;
  --accent-soft: #e5f0fb;
  --bar: #6da7ec;
  --bar-hover: #3987e5;
  --crit: #d03b3b;
  --warn: #d99100;
  --shadow: 0 1px 2px rgba(30, 40, 50, .04), 0 4px 16px rgba(30, 40, 50, .05);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #121314; --surface: #1b1c1e; --surface-2: #232427;
    --ink: #eceae4; --ink-2: #c3c2b7; --muted: #8d8c86;
    --line: #2d2e30; --line-strong: #3b3c3f;
    --accent: #6da7ec; --accent-soft: #1d2a3a;
    --bar: #3987e5; --bar-hover: #6da7ec;
    --crit: #e66767; --warn: #fab219;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #121314; --surface: #1b1c1e; --surface-2: #232427;
  --ink: #eceae4; --ink-2: #c3c2b7; --muted: #8d8c86;
  --line: #2d2e30; --line-strong: #3b3c3f;
  --accent: #6da7ec; --accent-soft: #1d2a3a;
  --bar: #3987e5; --bar-hover: #6da7ec;
  --crit: #e66767; --warn: #fab219;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", "Leelawadee UI", "Thonburi", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, p { margin: 0; }
button, select, input { font: inherit; color: inherit; }

.page { max-width: 1800px; margin: 0 auto; padding: 28px 24px 40px; }

.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 { font-size: 26px; font-weight: 700; margin: 4px 0 6px; letter-spacing: -.01em; }
.sub { color: var(--ink-2); font-size: 13px; }
.alloc-note {
  display: inline-block; margin-top: 8px; font-size: 12px; color: #1f5f3a; background: #e3f4ea;
  border: 1px solid #b7e0c6; border-radius: 999px; padding: 3px 12px;
}
.alloc-note[hidden] { display: none; }
.sub .dot { margin: 0 8px; color: var(--muted); }

.ghost {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 14px; cursor: pointer; color: var(--ink-2); white-space: nowrap; text-decoration: none; font-size: 13px;
}
.ghost:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.ghost.small { padding: 4px 12px; font-size: 12px; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px 20px;
}
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card-head h2 { font-size: 15px; font-weight: 650; }
.hint { font-size: 12px; color: var(--muted); }
.count { font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 6px; }

.head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ret-info { font-size: 12px; color: var(--ink-2); background: #fff2cc; border-radius: 999px; padding: 3px 10px; color: #7f6000; }
.ret-info:empty { display: none; }
.primary {
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap;
  background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: 999px;
  padding: 7px 18px; font-size: 13px; font-weight: 600;
}
.primary.small { padding: 4px 16px; font-size: 12px; }
.primary:hover:not(:disabled) { filter: brightness(1.08); }
.primary:disabled { background: var(--surface-2); color: var(--muted); border-color: var(--line); cursor: default; }
.save-state { font-size: 12px; color: var(--muted); }
.sync-state { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.sync-state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync-state.shared::before { background: #1f9d55; box-shadow: 0 0 0 3px rgba(31,157,85,.18); }
.sync-state.error { color: var(--crit); }
.sync-state.error::before { background: var(--crit); }
.sync-state.flash { color: #1f7a45; font-weight: 600; }
.save-state.dirty { color: #b45309; font-weight: 600; }
.save-state.dirty::before { content: "● "; }
.ret-hint { font-size: 12px; color: var(--muted); margin: -4px 0 10px; }

/* 言語切り替え */
.lang-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 2px; }
.lang-switch button {
  border: 0; background: none; cursor: pointer; padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--ink-2);
}
.lang-switch button:hover { color: var(--ink); background: var(--surface-2); }
.lang-switch button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }

/* 見出しの ▼ フィルター (Excel のオートフィルター風) */
.sheet thead th { position: sticky; }
.sheet .af {
  position: absolute; right: 2px; bottom: 3px; width: 15px; height: 15px; padding: 0; margin: 0;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  background: #f2f2f2; border: 1px solid #a6a6a6; border-radius: 2px;
}
.sheet .af svg { width: 10px; height: 10px; fill: #404040; }
.sheet .af .af-funnel { display: none; }
.sheet .af:hover { background: #ffffff; }
.sheet .af.on { background: #ffd966; border-color: #bf8f00; }
.sheet .af.on .af-arrow { display: none; }
.sheet .af.on .af-funnel { display: block; }
.sheet thead tr.h1 th[rowspan] { padding-right: 18px; }
.sheet thead tr.h1 th.grp { padding-right: 18px; }  /* 拠点の ▼ (表示する拠点を選ぶ) */
.sheet thead tr.h2 th { padding-right: 18px; }
.sheet thead tr.h2 th.ret-h { padding-right: 3px; }

.af-hint { font-size: 12px; color: var(--muted); margin: -6px 0 10px; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 10px; font-size: 12px; }
.chips-label { color: var(--muted); }
.chip {
  display: inline-flex; align-items: center; gap: 4px; background: #fff2cc; color: #5c4600;
  border: 1px solid #f1d27a; border-radius: 999px; padding: 2px 4px 2px 10px;
}
.chip b { font-weight: 600; }
.chip button { border: 0; background: none; cursor: pointer; color: #7f6000; font-size: 14px; line-height: 1; padding: 0 4px; border-radius: 999px; }
.chip button:hover { background: #f1d27a; }
.chip-clear { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 12px; text-decoration: underline; }

.af-pop {
  position: fixed; z-index: 60; width: 280px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18);
  padding: 10px; font-size: 13px;
}
.af-head { font-weight: 650; margin-bottom: 8px; }
.af-search { width: 100%; height: 30px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 8px; background: var(--surface); margin-bottom: 6px; }
.af-list { max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 4px 0; }
.af-list label { display: flex; align-items: center; gap: 6px; padding: 3px 10px; cursor: pointer; }
.af-list label:hover { background: var(--surface-2); }
.af-list label[hidden] { display: none; }
.af-list label span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.af-list label em { font-style: normal; color: var(--muted); font-size: 11px; }
.af-list .af-all { border-bottom: 1px solid var(--line); margin-bottom: 2px; font-weight: 600; }
.af-num { display: flex; flex-direction: column; gap: 6px; padding: 2px 2px 4px; }
.af-num label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.af-range { display: flex; align-items: center; gap: 6px; padding-left: 22px; }
.af-range input { width: 90px; height: 30px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 8px; background: var(--surface); }
.af-foot { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.af-foot span { flex: 1; }

/* 範囲選択 (Excel と同じ緑の枠) */
.sheet tbody td { cursor: cell; }
.sheet tbody td.sel { background-color: #d9eadf !important; }
.sheet tbody td.ret.sel { background-color: #e6efcf !important; }
.sheet tbody td.sel {
  --st: 0px; --sb: 0px; --sl: 0px; --sr: 0px;
  box-shadow: inset 0 var(--st) 0 #217346, inset 0 calc(-1 * var(--sb)) 0 #217346,
              inset var(--sl) 0 0 #217346, inset calc(-1 * var(--sr)) 0 0 #217346;
}
.sheet tbody td.sel-t { --st: 2px; }
.sheet tbody td.sel-b { --sb: 2px; }
.sheet tbody td.sel-l { --sl: 2px; }
.sheet tbody td.sel-r { --sr: 2px; }
body.selecting, body.selecting * { user-select: none; -webkit-user-select: none; }
.sel-bar {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 70;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center;
  background: #217346; color: #fff; border-radius: 999px; padding: 8px 10px 8px 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 13px; max-width: calc(100vw - 32px);
}
.sel-bar b { font-size: 15px; font-variant-numeric: tabular-nums; }
.sel-bar .sel-size, .sel-bar .sel-copy { opacity: .75; font-size: 12px; }
.sel-bar.copied .sel-copy { opacity: 1; font-weight: 700; }
.sel-bar button { border: 0; background: rgba(255,255,255,.18); color: #fff; width: 26px; height: 26px; border-radius: 999px; cursor: pointer; font-size: 16px; line-height: 1; }
.sel-bar button:hover { background: rgba(255,255,255,.3); }
@media (max-width: 560px) { .sel-bar .sel-copy { display: none; } }

/* tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line-strong); }
.tab {
  border: 0; background: none; cursor: pointer; padding: 10px 18px; font-size: 14px; font-weight: 600; color: var(--muted);
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.view[hidden] { display: none; }
.view-note { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.view-note:empty { display: none; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.kpi {
  display: block; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px;
}
.kpi > span { display: block; }
.kpi-btn { cursor: pointer; }
.kpi-btn:hover { border-color: var(--accent); }
.kpi-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.kpi-label { color: var(--ink-2); font-size: 13px; display: flex !important; align-items: center; gap: 6px; }
.kpi-value { font-size: 30px; font-weight: 700; margin: 4px 0 2px; letter-spacing: -.01em; }
.kpi-note { color: var(--muted); font-size: 12px; }
.status-ic { font-size: 11px; }
.status-ic.crit { color: var(--crit); }
.status-ic.warn { color: var(--warn); }

/* charts */
.charts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; margin-bottom: 14px; }
.bars { display: flex; flex-direction: column; gap: 2px; }
.bar-row {
  display: grid; grid-template-columns: minmax(96px, 34%) 1fr 52px; align-items: center; gap: 10px;
  padding: 5px 6px; border-radius: 8px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%;
}
.bar-row:hover, .bar-row:focus-visible { background: var(--surface-2); outline: none; }
.bar-row.active { background: var(--accent-soft); }
.bar-label { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { display: block; height: 14px; }
.bar-fill { display: block; height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; transition: width .35s ease, background .15s; }
.bar-row:hover .bar-fill, .bar-row.active .bar-fill { background: var(--bar-hover); }
.bar-val { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.bars.compact .bar-row { padding: 2px 6px; }
.bars.compact .bar-track { height: 11px; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; margin-bottom: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 130px; }
.field.grow { flex: 1 1 220px; }
.field > span { font-size: 12px; color: var(--muted); }
.field input, .field select {
  height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface);
}
.field input:focus, .field select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.filters .ghost { height: 36px; }
.check-toggle { display: inline-flex; align-items: center; gap: 6px; height: 36px; font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.check-toggle[hidden] { display: none; }
/* 複数選択のドロップダウン (モデル・カラー・サイズ) */
.ms {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-width: 150px; max-width: 240px;
  height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface);
  cursor: pointer; text-align: left;
}
.ms .ms-val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms svg { width: 10px; height: 10px; fill: var(--ink-2); flex: none; }
.ms:hover { border-color: var(--accent); }
.ms.on { border-color: #bf8f00; background: #fff8e1; color: #5c4600; font-weight: 600; }
:root[data-theme="dark"] .ms.on { background: #3a3020; color: #fde9a8; }

.tip {
  position: fixed; pointer-events: none; z-index: 50; background: var(--ink); color: var(--surface);
  padding: 7px 10px; border-radius: 8px; font-size: 12px; line-height: 1.45; box-shadow: 0 6px 20px rgba(0,0,0,.18);
  max-width: 260px;
}
.foot { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }

/* =========================================================
   在庫表: Store_Stock_*.xlsx「VFF Shoes Stock」シートの書式をそのまま再現
   (ダークモードでも Excel と同じ白地のまま)
   ========================================================= */
.sheet {
  --x-header: #1f4e78;      /* 見出し (Quantity) */
  --x-header-ret: #bf8f00;  /* 見出し (Return) */
  --x-ret-fill: #fff2cc;    /* Return 列 */
  --x-ret-ink: #0000ff;
  --x-total-fill: #d9e1f2;  /* Total 行 */
  --x-row-border: #d9d9d9;  /* 行の下罫線 */
  --x-gridline: #e1e1e1;    /* Excel の枠線 */
  --row-h: 20px;            /* 14.5pt */
  --head-h: 27px;           /* 20pt */
  --title-h: 25px;          /* 18.5pt */

  color-scheme: light;
  background: #ffffff;
  color: #000000;
  font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  font-size: 11pt;
  line-height: 1;
  border: 1px solid var(--line-strong);
}
/* 画面幅に収まるよう JS で zoom を設定 (縦・横ともスクロールなし) */
.sheet table { zoom: var(--fit, 1); }
.sheet table { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: max-content; }
.sheet th, .sheet td {
  height: var(--row-h);
  padding: 0 3px;
  white-space: nowrap;
  overflow: hidden;
  border-right: 1px solid var(--x-gridline);
  border-bottom: 1px solid var(--x-row-border);
}
.sheet td.c { text-align: center; }
.sheet td.b { font-weight: 700; }
.sheet td.ret { background: var(--x-ret-fill); color: var(--x-ret-ink); }
.sheet td.ret { padding: 0; }
/* Excel で黄色に塗られていたマス */
.sheet td.hl, .sheet td.ret.hl { background: #ffff00; }
.sheet .ret-in {
  display: block; width: 100%; height: calc(var(--row-h) - 1px); margin: 0; padding: 0 3px;
  border: 0; background: transparent; color: var(--x-ret-ink);
  font: inherit; text-align: center; cursor: cell;
}
.sheet .ret-in:hover { background: #ffe699; }
.sheet .ret-in:focus { outline: 2px solid #217346; outline-offset: -2px; background: #ffffff; cursor: text; }
.sheet .ret-in.invalid { outline: 2px solid #d03b3b; outline-offset: -2px; }

/* ウィンドウ枠の固定 (A5): 1〜4 行目は常に表示 */
.sheet thead tr.title th, .sheet thead tr.asof th {
  position: sticky; z-index: 3; background: #ffffff; text-align: left; font-weight: 400;
  border-right: 0; border-bottom: 1px solid var(--x-gridline);
}
.sheet thead tr.title th { top: 0; height: var(--title-h); font-size: 14pt; font-weight: 700; }
.sheet thead tr.asof th { top: var(--title-h); }
.sheet thead tr.h1 th, .sheet thead tr.h2 th {
  position: sticky; z-index: 2; height: var(--head-h);
  background: var(--x-header); color: #ffffff; font-weight: 700; text-align: center; vertical-align: middle;
  border-right: 1px solid #ffffff; border-bottom: 1px solid #ffffff;
}
.sheet thead tr.h1 th { top: calc(var(--title-h) + var(--row-h)); }
.sheet thead tr.h2 th { top: calc(var(--title-h) + var(--row-h) + var(--head-h)); }
.sheet thead tr.h2 th.ret-h { background: var(--x-header-ret); }
.sheet thead tr.h2 th.rate-h, .sheet thead tr.h2 th.mos-h { background: #2f75b5; font-size: 8.5pt; white-space: normal; line-height: 1.05; padding: 0 1px; }
.sheet td.rate { color: #1f4e78; }
/* 画面用に列を狭くしたので見出しは小さめ・折り返し可 */
.sheet thead tr.h1 th.grp { font-size: 9.5pt; white-space: normal; line-height: 1.05; padding: 0 2px; }
.sheet thead tr.h2 th { font-size: 9pt; padding-left: 1px; }
.sheet thead tr.h2 th.ret-h { padding: 0 1px; }
.sheet tbody td { padding: 0 2px; }
.sheet tbody td.ret { padding: 0; }
.sheet .ret-in { padding: 0 1px; }
.sheet td.mos { color: #1f4e78; font-style: italic; }
.sheet tr.total td { background: var(--x-total-fill); font-weight: 700; }
.sheet td.empty { text-align: center; color: #595959; height: 40px; }

@media (max-width: 960px) {
  .charts { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .page { padding: 18px 16px 32px; }
  h1 { font-size: 21px; }
  .kpi-value { font-size: 24px; }
  .card { padding: 14px; }
  .field { min-width: calc(50% - 6px); flex: 1 1 calc(50% - 6px); }
  .field.grow { flex-basis: 100%; }
  .top { flex-direction: column; }
  .top-actions { justify-content: flex-start; }
}

@media print {
  body { background: #fff; }
  .top-actions, .kpis, .charts, .filters, #dlCsv, .foot { display: none; }
  .card { border: 0; box-shadow: none; padding: 0; }
  .sel-bar, .tabs, .view-note, .ret-hint, .af-hint, .chips, .head-actions, .sheet .af { display: none; }
  #view-table { display: block !important; }
  .sheet { border: 0; }
  .sheet thead th { position: static; }
  .sheet th, .sheet td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
[hidden] { display: none !important; }

/* 拠点フィルター: Store Total の前に区切り線 */
.af-list label.af-sep { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 6px; }
.af-note { margin: 6px 0 0; font-size: 12px; color: var(--muted); line-height: 1.4; }

/* 詳細タブ: 在庫一覧の使い方 */
.guide { margin-bottom: 16px; }
.guide h2 { font-size: 15px; margin: 0 0 8px; }
.guide .alloc-note { margin: 0 0 12px; }
.guide-list { margin: 0; padding-left: 20px; font-size: 13px; color: var(--ink-2); line-height: 1.6; }
.guide-list li + li { margin-top: 4px; }

/* 返品の受領 */
.recv-btn {
  border: 1px solid #b7e0c6; background: #e3f4ea; color: #1f5f3a; border-radius: 999px;
  font: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; cursor: pointer;
}
.recv-btn:hover { background: #d2ecdc; }
.recv-btn[hidden] { display: none; }
.recv-dlg {
  width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink);
  box-shadow: 0 16px 48px rgba(0,0,0,.25);
}
.recv-dlg::backdrop { background: rgba(20, 24, 30, .35); }
.recv-inner { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.recv-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 0; }
.recv-head h2 { margin: 0; font-size: 18px; }
.recv-x { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink-2); }
.recv-note { margin: 8px 20px 0; font-size: 13px; color: var(--ink-2); line-height: 1.55; }
.recv-warn { margin: 8px 20px 0; font-size: 13px; color: #8a5a00; background: #fff4d6; border: 1px solid #f0d68a; border-radius: 8px; padding: 6px 10px; }
.recv-warn[hidden] { display: none; }
.recv-body { overflow: auto; padding: 4px 20px 8px; flex: 1; }
.recv-body h3 { font-size: 14px; margin: 14px 0 6px; }
.recv-empty { font-size: 13px; color: var(--muted); }
.link-btn { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; font-size: 12px; text-decoration: underline; }
.recv-foot { display: flex; align-items: center; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
.recv-sel { margin-right: auto; font-size: 13px; color: var(--ink-2); }
.recv-foot[hidden] { display: none; }
.recv-step { font-size: 13px; color: var(--ink); margin: 12px 0 8px; font-weight: 600; }
.recv-stores { display: grid; gap: 8px; }
.recv-storebtn {
  display: grid; grid-template-columns: 1fr auto 16px; grid-template-rows: auto auto; column-gap: 12px; align-items: center;
  text-align: left; width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink); font: inherit; cursor: pointer;
}
.recv-storebtn:hover { border-color: var(--accent); background: var(--accent-soft, #eef5fc); }
.recv-storebtn b { font-size: 15px; }
.recv-storebtn .recv-pend { font-size: 13px; font-weight: 700; color: #8a5a00; }
.recv-storebtn .recv-doneinfo { grid-column: 1 / 3; font-size: 12px; color: var(--muted); }
.recv-storebtn .recv-go { grid-row: 1 / 3; grid-column: 3; font-size: 22px; color: var(--muted); }
.recv-nav { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.recv-nav b { font-size: 16px; }
.recv-nav .recv-count { margin-left: auto; font-size: 13px; color: #8a5a00; font-weight: 700; }
.recv-selall { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 6px; cursor: pointer; }
.recv-model { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.recv-mhead { display: flex; align-items: center; padding: 8px 12px; background: var(--surface-2); }
.recv-mhead label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.recv-mhead .recv-count { margin-left: auto; font-size: 12px; color: var(--muted); }
.recv-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.recv-tbl th { font-size: 11px; font-weight: 600; color: var(--muted); text-align: left; padding: 4px 8px; }
.recv-tbl td { padding: 5px 8px; border-top: 1px solid var(--line); }
.recv-tbl td:first-child, .recv-tbl th:first-child { width: 28px; padding-left: 12px; }
.recv-tbl td.c { text-align: center; } .recv-tbl th:nth-child(3) { text-align: center; }
.recv-tbl td.n, .recv-tbl th:last-child { text-align: right; padding-right: 14px; width: 60px; }
.recv-tbl td.n { font-weight: 700; }
.recv-tbl label { cursor: pointer; display: block; }
.recv-tbl tr:has(input:checked) td { background: #e3f4ea; }
.recv-done { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; }
.recv-done summary { padding: 8px 12px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.recv-done ul { list-style: none; margin: 0; padding: 0 12px 8px; }
.recv-done li { display: flex; align-items: center; gap: 10px; padding: 4px 0; border-top: 1px solid var(--line); font-size: 13px; }
.recv-done li > span { flex: 1; }
.recv-done li em { font-style: normal; font-weight: 700; }

/* Vivo 販売ダッシュボード (vivo.html)。基本の配色・部品は style.css を使う */
:root { --co-bft: #2a78d6; --co-edv: #eb6834; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --co-bft: #3987e5; --co-edv: #d95926; }
}
:root[data-theme="dark"] { --co-bft: #3987e5; --co-edv: #d95926; }

.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; flex: none; }
.sw[data-co="BFT"] { background: var(--co-bft); }
.sw[data-co="EDV"] { background: var(--co-edv); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); }

/* フィルター */
.vf { margin-bottom: 14px; display: flex; flex-direction: column; gap: 14px; }
.vf-row { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
.vf-group { display: flex; flex-direction: column; gap: 4px; }
.vf-label { font-size: 12px; color: var(--muted); }
.vf-input { height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); min-width: 140px; }
.vf-input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.vf .ghost { height: 36px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); padding: 2px; gap: 2px; }
.seg button {
  display: inline-flex; align-items: center; border: 0; background: none; cursor: pointer;
  height: 30px; padding: 0 14px; border-radius: 8px; font-size: 13px; color: var(--ink-2); white-space: nowrap;
}
.seg button:hover { background: var(--surface-2); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
.seg button[aria-pressed="true"] .sw { box-shadow: 0 0 0 2px #fff; }
.loc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.loc-chip {
  display: inline-flex; align-items: center; gap: 2px; cursor: pointer; font-size: 13px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 5px 12px;
}
.loc-chip:hover { border-color: var(--accent); }
.loc-chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.loc-chip .co { font-size: 11px; color: var(--muted); font-weight: 600; margin-right: 4px; }
.loc-chip .n { font-size: 12px; color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; font-weight: 400; }
.loc-chip.all { font-weight: 600; }

.kpi-main .kpi-value { color: var(--accent); }
.kpi-note .sw { width: 8px; height: 8px; margin-right: 4px; vertical-align: 0; }
.kpi-note .co-split { margin-right: 12px; white-space: nowrap; }

.vc { margin-bottom: 14px; }
.vgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

/* 縦棒 (日別・サイズ別)。会社ごとに積み上げ、間に 2px のすき間 */
.vbars { position: relative; height: 220px; padding: 0 0 22px 34px; }
.vbars.short { height: 200px; }
.vbars .grid { position: absolute; left: 34px; right: 0; border-top: 1px solid var(--line); }
.vbars .grid span { position: absolute; left: -34px; top: -8px; width: 28px; text-align: right; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.vbars .grid.base { border-top-color: var(--line-strong); }
.vbars .cols { position: relative; display: flex; align-items: flex-end; height: 100%; gap: 2px; }
.vbars .col { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; position: relative; cursor: default; }
.vbars .col:hover { background: var(--surface-2); border-radius: 4px 4px 0 0; }
.vbars .seg-b { width: 72%; max-width: 30px; }
.vbars .seg-b[data-co="BFT"] { background: var(--co-bft); }
.vbars .seg-b[data-co="EDV"] { background: var(--co-edv); }
.vbars .seg-b.cap { border-radius: 4px 4px 0 0; }
.vbars .xl { position: absolute; bottom: -20px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.vbars .vtot { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* 横棒 (会社別に積み上げ) */
.bar-row.static { cursor: default; }
.bar-row.static:hover { background: var(--surface-2); }
.bar-track.stack { display: flex; gap: 2px; }
.bar-track.stack .bar-fill { border-radius: 0; transition: width .35s ease; }
.bar-track.stack .bar-fill:last-child { border-radius: 0 4px 4px 0; }
.bar-fill[data-co="BFT"] { background: var(--co-bft); }
.bar-fill[data-co="EDV"] { background: var(--co-edv); }
.bar-row:hover .bar-fill[data-co], .bar-row.active .bar-fill[data-co] { filter: brightness(1.08); }
.bar-label .co { font-size: 11px; color: var(--muted); font-weight: 600; margin-right: 4px; }
.empty-note { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }

/* 明細表 */
.vtable-wrap { overflow: auto; max-height: 640px; border: 1px solid var(--line); border-radius: 10px; }
.vtable { border-collapse: collapse; width: 100%; font-size: 13px; }
.vtable th, .vtable td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.vtable thead th { font-size: 12px; color: var(--ink-2); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; cursor: pointer; user-select: none; }
.vtable thead th:hover { color: var(--ink); }
.vtable thead th[aria-sort]::after { content: " ▼"; font-size: 9px; color: var(--accent); }
.vtable thead th[aria-sort="ascending"]::after { content: " ▲"; }
.vtable .num { text-align: right; font-variant-numeric: tabular-nums; }
.vtable td.zero { color: var(--muted); }
.vtable tfoot td { font-weight: 700; background: var(--surface-2); border-bottom: 0; position: sticky; bottom: 0; }
.vtable tbody tr:hover td { background: var(--surface-2); }

@media (max-width: 960px) {
  .vgrid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {

  .vbars .grid { left: 28px; }
  .vbars .grid span { left: -28px; width: 24px; }
  .vbars .vtot { display: none; }
}

  const hideTip = () => (tip.hidden = true);
  const tipBody = (title, byCo, amt) => {
    const tot = COS.reduce((s, c) => s + (byCo[c] || 0), 0);
    return `<b>${esc(title)}</b><br>` +
      COS.map((c) => `<i class="sw" data-co="${c}"></i>${c}: ${fmt(byCo[c] || 0)}`).join("<br>") +
      `<br>${esc(t("tip.qty"))}: <b>${fmt(tot)}</b>` + (amt !== undefined ? `<br>${esc(t("tip.amt"))}: ฿${fmt(amt)}` : "");
  };
  function bindTips(root, getHtml) {
    root.querySelectorAll("[data-k]").forEach((el) => {
      el.addEventListener("mousemove", (e) => showTip(e, getHtml(el.dataset.k)));
      el.addEventListener("mouseleave", hideTip);
    });
  }

  /* ---------- 集計 ---------- */
  const group = (rows, keyFn) => {
    const m = new Map();
    rows.forEach((r) => {
      const k = keyFn(r);
      let g = m.get(k);
      if (!g) m.set(k, (g = { key: k, qty: 0, amount: 0, BFT: 0, EDV: 0 }));
      g.qty += r.qty; g.amount += r.amount; g[r.co] += r.qty;
    });
    return m;
  };

  // 横棒 (会社ごとに積み上げ)
  function hbars(el, entries, { label, onClick, active, single }) {
    if (!entries.length) { el.innerHTML = `<p class="empty-note">${esc(t("empty"))}</p>`; return; }
    const max = Math.max(...entries.map((e) => e.qty));
    el.innerHTML = entries.map((e) => {
      const segs = COS.filter((c) => e[c] > 0).map((c) => `<span class="bar-fill" data-co="${c}" style="width:${(e[c] / max) * 100}%"></span>`).join("");
      const tag = onClick ? "button" : "div";
      return `<${tag} ${onClick ? 'type="button"' : ""} class="bar-row${onClick ? "" : " static"}${active === e.key ? " active" : ""}" data-k="${esc(e.key)}">` +
        `<span class="bar-label" title="${esc(single ? "" : e.key)}">${label(e)}</span>` +
        `<span class="bar-track stack">${segs}</span><span class="bar-val">${fmt(e.qty)}</span></${tag}>`;
    }).join("");
    const map = new Map(entries.map((e) => [String(e.key), e]));
    bindTips(el, (k) => { const e = map.get(k); return tipBody(e.title || e.key, { BFT: e.BFT, EDV: e.EDV }, e.amount); });
    if (onClick) el.querySelectorAll(".bar-row").forEach((b) => b.addEventListener("click", () => onClick(b.dataset.k)));
  }

  // 縦棒 (会社ごとに積み上げ)
  function vbars(el, entries, { xLabel, showTotals }) {
    if (!entries.some((e) => e.qty)) { el.innerHTML = `<p class="empty-note">${esc(t("empty"))}</p>`; return; }
    const maxV = Math.max(...entries.map((e) => e.qty));
    const step = maxV <= 5 ? 1 : maxV <= 10 ? 2 : maxV <= 25 ? 5 : maxV <= 50 ? 10 : Math.ceil(maxV / 5 / 10) * 10;
    const top = Math.ceil(maxV / step) * step;
    const width = el.clientWidth || 600;
    const every = Math.max(1, Math.ceil(entries.length / Math.max(1, Math.floor((width - 40) / 46))));
    // 棒の上に合計ラベルを置く分 (16px) を空け、目盛り線も同じ基準にする
    let grid = "";
    for (let v = 0; v <= top; v += step) grid += `<div class="grid${v === 0 ? " base" : ""}" style="bottom:calc(22px + (100% - 38px) * ${v / top})"><span>${v}</span></div>`;
    const cols = entries.map((e, i) => {
      const present = COS.filter((c) => e[c] > 0);
      const segs = present.slice().reverse().map((c, j) => `<span class="seg-b${j === 0 ? " cap" : ""}" data-co="${c}" style="height:calc((100% - 16px) * ${e[c] / top})"></span>`).join("");
      return `<div class="col" data-k="${esc(e.key)}">${showTotals && e.qty ? `<span class="vtot">${e.qty}</span>` : ""}${segs}` +
        `${i % every === 0 ? `<span class="xl">${esc(xLabel(e))}</span>` : ""}</div>`;
    }).join("");
    el.innerHTML = grid + `<div class="cols">${cols}</div>`;
    const map = new Map(entries.map((e) => [String(e.key), e]));
    bindTips(el, (k) => { const e = map.get(k); return tipBody(e.title || xLabel(e), { BFT: e.BFT, EDV: e.EDV }, e.amount); });
  }

  /* ---------- 描画 ---------- */
  let current = [];
  function render() {
    syncSeg("segCompany", state.company);
    syncSeg("segType", state.type);
    renderLocChips();
    const locIds = activeLocIds();
    const rows = lines.filter((r) => passBase(r) && locIds.has(r.loc));
    current = rows;

    // KPI
    const qty = rows.reduce((s, r) => s + r.qty, 0);
    const amt = rows.reduce((s, r) => s + r.amount, 0);
    const orders = new Set(rows.map((r) => `${r.co}|${r.order}`)).size;
    const usedLocs = new Set(rows.map((r) => r.loc)).size;
    const coQty = (c) => rows.reduce((s, r) => s + (r.co === c ? r.qty : 0), 0);
    const coAmt = (c) => rows.reduce((s, r) => s + (r.co === c ? r.amount : 0), 0);
    $("kQty").textContent = fmt(qty);
    $("kQtyNote").innerHTML = COS.map((c) => `<span class="co-split"><i class="sw" data-co="${c}"></i>${c} ${fmt(coQty(c))}</span>`).join("");
    $("kAmt").textContent = `฿${fmt(amt)}`;
    $("kAmtNote").innerHTML = COS.map((c) => `<span class="co-split"><i class="sw" data-co="${c}"></i>${c} ฿${fmt(coAmt(c))}</span>`).join("");
    $("kOrders").textContent = fmt(orders);
    $("kOrdersNote").textContent = t("kpi.ordersNote", { n: usedLocs });
    $("kAvg").textContent = qty ? `฿${fmt(amt / qty)}` : "–";

    // 日別 (期間内の全日。販売のない日も 0 で表示)
    const from = state.from || data.from, to = state.to || data.to;
    const byDay = group(rows, (r) => r.date);
    const days = [];
    for (let d = new Date(`${from}T00:00:00Z`); d <= new Date(`${to}T00:00:00Z`) && days.length < 800; d.setUTCDate(d.getUTCDate() + 1)) {
      const k = d.toISOString().slice(0, 10);
      const g = byDay.get(k) || { key: k, qty: 0, amount: 0, BFT: 0, EDV: 0 };
      g.title = fmtDate(k, true);
      days.push(g);
    }
    vbars($("dailyChart"), days, { xLabel: (e) => fmtDate(e.key), showTotals: days.length <= 62 });

    // 販売場所別
    const byLoc = [...group(rows, (r) => r.loc).values()].sort((a, b) => b.qty - a.qty);
    byLoc.forEach((e) => (e.title = locLabelText(LOC[e.key])));
    const oneLoc = state.locs.size === 1 ? [...state.locs][0] : "";
    hbars($("locChart"), byLoc, {
      label: (e) => `<i class="sw" data-co="${LOC[e.key].company}"></i>${locLabelHtml(LOC[e.key])}`,
      active: oneLoc,
      single: true,
      onClick: (k) => { if (state.locs.size === 1 && state.locs.has(k)) state.locs.clear(); else { state.locs.clear(); state.locs.add(k); } render(); },
    });

    // モデル別
    const byModel = [...group(lines.filter((r) => (state.pending || !r.pending) && (!state.from || r.date >= state.from) && (!state.to || r.date <= state.to) && locIds.has(r.loc)), (r) => r.model).values()]
      .sort((a, b) => b.qty - a.qty || a.key.localeCompare(b.key));
    hbars($("modelChart"), byModel, {
      label: (e) => esc(e.key),
      active: state.model,
      onClick: (k) => { state.model = state.model === k ? "" : k; $("fModel").value = state.model; render(); },
    });

    // サイズ別
    const bySz = [...group(rows, (r) => r.size || "-").values()].sort((a, b) => bySize(a.key, b.key));
    vbars($("sizeChart"), bySz, { xLabel: (e) => e.key, showTotals: true });

    // カラー別
    const byColor = [...group(rows, (r) => r.color || "-").values()].sort((a, b) => b.qty - a.qty || a.key.localeCompare(b.key));
    hbars($("colorChart"), byColor, { label: (e) => esc(e.key) });

    renderTable(rows, locIds);

    $("period").textContent = t("period", { f: fmtDate(data.from, true), t: fmtDate(data.to, true) });
    $("source").textContent = t("src", { b: data.sources.BFT, e: data.sources.EDV });
    $("foot").textContent = t("foot", { d: data.generated.replace("T", " ").slice(0, 16) });
  }

  /* ---------- 明細表 (モデル × カラー × サイズ、販売場所ごとの列) ---------- */
  let tableCache = null;
  function renderTable(rows, locIds) {
    const locs = data.locations.filter((l) => locIds.has(l.id) && rows.some((r) => r.loc === l.id));
    const m = new Map();
    rows.forEach((r) => {
      const k = `${r.model}\t${r.color}\t${r.size}`;
      let g = m.get(k);
      if (!g) m.set(k, (g = { model: r.model, color: r.color, size: r.size, total: 0, amount: 0, by: {} }));
      g.total += r.qty; g.amount += r.amount; g.by[r.loc] = (g.by[r.loc] || 0) + r.qty;
    });
    const items = [...m.values()];
    const cols = [
      { key: "model", label: t("t.model") },
      { key: "color", label: t("t.color") },
      { key: "size", label: t("t.size") },
      ...locs.map((l) => ({ key: `loc:${l.id}`, label: locLabelText(l), loc: l, num: true })),
      { key: "total", label: t("t.total"), num: true },
      { key: "amount", label: t("t.amount"), num: true },
    ];
    if (!cols.some((c) => c.key === sort.key)) sort = { key: "total", dir: -1 };
    const val = (it, key) => (key.startsWith("loc:") ? it.by[key.slice(4)] || 0 : it[key]);
    items.sort((a, b) => {
      let d;
      if (sort.key === "size") d = bySize(a.size, b.size);
      else { const x = val(a, sort.key), y = val(b, sort.key); d = typeof x === "number" ? x - y : String(x).localeCompare(String(y)); }
      return d * sort.dir || b.total - a.total || a.model.localeCompare(b.model) || bySize(a.size, b.size);
    });
    tableCache = { cols, items, val };

    $("tCount").textContent = t("t.items", { n: items.length });
    $("tHead").innerHTML = `<tr>${cols.map((c) => `<th class="${c.num ? "num" : ""}" data-key="${esc(c.key)}"${sort.key === c.key ? ` aria-sort="${sort.dir > 0 ? "ascending" : "descending"}"` : ""}>` +
      `${c.loc ? `<i class="sw" data-co="${c.loc.company}"></i>` : ""}${esc(c.label)}</th>`).join("")}</tr>`;
    $("tBody").innerHTML = items.length
      ? items.map((it) => `<tr>${cols.map((c) => {
        const v = val(it, c.key);
        if (!c.num) return `<td>${esc(v)}</td>`;
        return `<td class="num${v ? "" : " zero"}">${v ? fmt(v) : "-"}</td>`;
      }).join("")}</tr>`).join("")
      : `<tr><td colspan="${cols.length}" class="empty-note">${esc(t("empty"))}</td></tr>`;
    $("tFoot").innerHTML = items.length ? `<tr>${cols.map((c, i) => {
      if (i === 0) return `<td>${esc(t("t.sum"))}</td>`;
      if (!c.num) return "<td></td>";
      return `<td class="num">${fmt(items.reduce((s, it) => s + val(it, c.key), 0))}</td>`;
    }).join("")}</tr>` : "";
  }
  $("tHead").addEventListener("click", (e) => {
    const th = e.target.closest("th"); if (!th) return;
    const k = th.dataset.key;
    sort = sort.key === k ? { key: k, dir: -sort.dir } : { key: k, dir: ["model", "color", "size"].includes(k) ? 1 : -1 };
    renderTable(current, activeLocIds());
  });
  // 表をタブ区切りでコピー (Excel・スプレッドシートにそのまま貼り付けできる)
  $("copyTable").addEventListener("click", () => {
    if (!tableCache) return;
    const { cols, items, val } = tableCache;
    const tsv = [cols.map((c) => c.label).join("\t"), ...items.map((it) => cols.map((c) => (c.num ? Math.round(val(it, c.key) * 100) / 100 : val(it, c.key))).join("\t"))].join("\n");
    const done = () => { $("copyTable").textContent = t("copied"); setTimeout(() => ($("copyTable").textContent = t("copy")), 1600); };
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = tsv; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (_) {}
      ta.remove();
    };
    if (navigator.clipboard) navigator.clipboard.writeText(tsv).then(done, fallback); else fallback();
  });
  if ($("dlCsv")) $("dlCsv").addEventListener("click", () => {
    if (!tableCache) return;
    const { cols, items, val } = tableCache;
    const q = (s) => `"${String(s).replace(/"/g, '""')}"`;
    const csv = [cols.map((c) => q(c.label)).join(","), ...items.map((it) => cols.map((c) => (c.num ? Math.round(val(it, c.key) * 100) / 100 : q(val(it, c.key)))).join(","))].join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
    a.download = `vivo_sales_${state.from || data.from}_${state.to || data.to}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  let rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => data && render(), 150); });

  // 単体版は window.VIVO_DATA にデータを埋め込む
  (window.VIVO_DATA ? Promise.resolve(window.VIVO_DATA) : fetch("vivo.json", { cache: "no-store" }).then((r) => r.json()))
    .then((d) => {
      data = d;
      LOC = Object.fromEntries(d.locations.map((l) => [l.id, l]));
      const ix = Object.fromEntries(d.fields.map((f, i) => [f, i]));
      lines = d.lines.map((x) => {
        const l = LOC[x[ix.loc]];
        return { date: x[ix.date], loc: l.id, co: l.company, type: l.type, order: x[ix.order], model: x[ix.model], color: x[ix.color],
          size: x[ix.size], qty: x[ix.qty], amount: x[ix.amount], pending: x[ix.status] === "pending" };
      });
      state.from = d.from; state.to = d.to;
      $("dFrom").value = d.from; $("dTo").value = d.to;
      $("dFrom").min = $("dTo").min = d.from; $("dFrom").max = $("dTo").max = d.to;
      fillModels();
      render();
    })
    .catch(() => { $("period").textContent = "vivo.json could not be loaded"; });
})();

</script>
</body>
</html>
