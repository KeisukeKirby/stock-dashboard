<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>BD Onboarding Dashboard</title>
  <meta name="description" content="Barefootinc (Thailand) / Endeavorz — Business Development onboarding dashboard (internal)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23243b53'/><text x='16' y='21' font-family='sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='middle'>BD</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow">Barefootinc (Thailand) / Endeavorz · 社外秘</p>
      <h1>BD オンボーディング・ダッシュボード</h1>
      <p class="sub"><span id="updatedAt">読み込み中…</span><span class="dot">·</span><span id="missingCount"></span></p>
    </div>
    <div class="top-actions">
      <button id="themeToggle" class="ghost" type="button" aria-label="表示モード切替"><span aria-hidden="true">◐</span> <span id="themeLabel">自動</span></button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="セクション">
    <a class="tab" href="#home" data-view="home">ホーム</a>
    <a class="tab" href="#brands" data-view="brands">ブランド</a>
    <a class="tab" href="#guidelines" data-view="guidelines">ガイドライン</a>
    <a class="tab" href="#sales" data-view="sales">月次売上</a>
    <a class="tab" href="#stores" data-view="stores">店舗一覧</a>
    <a class="tab" href="#consignment" data-view="consignment">委託販売</a>
    <a class="tab" href="#terms" data-view="terms">取引条件</a>
    <a class="tab" href="#sns" data-view="sns">SNS</a>
    <a class="tab" href="#requests" data-view="requests">未入力 <span class="badge" id="reqBadge"></span></a>
  </nav>

  <main>
    <section id="view-home" class="view" hidden></section>
    <section id="view-brands" class="view" hidden></section>
    <section id="view-guidelines" class="view" hidden></section>
    <section id="view-sales" class="view" hidden></section>
    <section id="view-stores" class="view" hidden></section>
    <section id="view-consignment" class="view" hidden></section>
    <section id="view-terms" class="view" hidden></section>
    <section id="view-sns" class="view" hidden></section>
    <section id="view-requests" class="view" hidden></section>
  </main>

  <footer class="foot">
    <p>数字・条件はすべて社内限り。各値の「出典」は数字の横の <span class="src" title="出典の例: pptx S11">src</span> にマウスを乗せると表示されます。データの更新手順は <a href="https://github.com/KeisukeKirby/stock-dashboard/tree/main/bd" target="_blank" rel="noopener">bd/README.md</a>。</p>
  </footer>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js?v=1"></script>
</body>
</html>
