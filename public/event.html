<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Sales</title>
  <meta name="description" content="Event sales results: daily sales, sales by model, category, weekday, hour and payment">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233b82c4'/><path d='M7 22l6-6 4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260930064253">
  <link rel="stylesheet" href="event.css?v=20260930">
</head>
<body>
  <div class="page">
    <header class="top">
      <div>
        <p class="eyebrow" data-t="eyebrow"></p>
        <h1 id="evName">–</h1>
        <p class="sub"><span id="evPeriod"></span><span class="dot">·</span><span id="evVenue"></span><span class="dot">·</span><span id="evSource"></span></p>
      </div>
      <div class="top-actions">
        <label class="ev-pick" id="evPickWrap" hidden><span class="sr" data-t="event.pick"></span><select id="evPick"></select></label>
        <a class="ghost" href="./" data-t="nav.stock"></a>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="ja" lang="ja">日本語</button>
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="th" lang="th">ไทย</button>
        </div>
        <button id="themeToggle" class="ghost" type="button"><span aria-hidden="true">◐</span> <span id="themeLabel"></span></button>
      </div>
    </header>

    <section class="filters ev-filters">
      <label class="field"><span data-t="f.cat"></span><select id="fCat"></select></label>
      <label class="field"><span data-t="f.from"></span><input type="date" id="fFrom"></label>
      <label class="field"><span data-t="f.to"></span><input type="date" id="fTo"></label>
      <button type="button" class="ghost" id="fReset" data-t="f.reset"></button>
      <p class="chips" id="chips"></p>
    </section>

    <section class="kpis ev-kpis">
      <div class="kpi"><p class="kpi-label" data-t="k.sales"></p><p class="kpi-value" id="kSales">–</p><p class="kpi-note" id="kSalesNote"></p></div>
      <div class="kpi"><p class="kpi-label" data-t="k.orders"></p><p class="kpi-value" id="kOrders">–</p><p class="kpi-note" id="kOrdersNote"></p></div>
      <div class="kpi"><p class="kpi-label" data-t="k.units"></p><p class="kpi-value" id="kUnits">–</p><p class="kpi-note" id="kUnitsNote"></p></div>
      <div class="kpi"><p class="kpi-label" data-t="k.aov"></p><p class="kpi-value" id="kAov">–</p><p class="kpi-note" id="kAovNote"></p></div>
      <div class="kpi"><p class="kpi-label" data-t="k.perDay"></p><p class="kpi-value" id="kPerDay">–</p><p class="kpi-note" id="kPerDayNote"></p></div>
      <div class="kpi"><p class="kpi-label" data-t="k.disc"></p><p class="kpi-value" id="kDisc">–</p><p class="kpi-note" id="kDiscNote"></p></div>
    </section>

    <section class="card ev-daily">
      <div class="card-head">
        <h2 id="dailyTitle"></h2>
        <div class="seg" role="group" id="metricSeg">
          <button type="button" data-metric="sales" data-t="m.sales"></button>
          <button type="button" data-metric="orders" data-t="m.orders"></button>
          <button type="button" data-metric="units" data-t="m.units"></button>
          <button type="button" data-metric="cum" data-t="m.cum"></button>
        </div>
      </div>
      <p class="hint" data-t="daily.hint"></p>
      <div class="chart-box" id="dailyChart"></div>
    </section>

    <section class="charts ev-grid">
      <div class="card">
        <div class="card-head"><h2 data-t="c.cat"></h2><p class="hint" data-t="c.catHint"></p></div>
        <div class="bars compact" id="catChart"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2 data-t="c.dow"></h2><p class="hint" data-t="c.dowHint"></p></div>
        <div class="bars" id="dowChart"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2 data-t="c.hour"></h2><p class="hint" id="hourHint"></p></div>
        <div class="bars compact" id="hourChart"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2 data-t="c.pay"></h2><p class="hint" data-t="c.payHint"></p></div>
        <div class="bars" id="payChart"></div>
      </div>
    </section>

    <section class="card ev-models">
      <div class="card-head">
        <h2><span data-t="c.model"></span><span class="count" id="modelCount"></span></h2>
        <div class="head-actions">
          <div class="seg" role="group" id="modelSortSeg">
            <button type="button" data-sort="sales" data-t="m.sales"></button>
            <button type="button" data-sort="units" data-t="m.units"></button>
          </div>
          <button type="button" class="ghost small" id="dlModels" data-t="dl.csv"></button>
        </div>
      </div>
      <p class="hint" data-t="model.hint"></p>
      <div class="tbl-wrap">
        <table class="ev-table" id="modelTable"></table>
      </div>
    </section>

    <section class="card ev-days">
      <div class="card-head">
        <h2 data-t="c.days"></h2>
        <button type="button" class="ghost small" id="dlDays" data-t="dl.csv"></button>
      </div>
      <div class="tbl-wrap">
        <table class="ev-table" id="dayTable"></table>
      </div>
    </section>

    <p class="foot" id="foot"></p>
  </div>
  <div class="tip" id="tip" hidden></div>
  <script src="event.js?v=20260930"></script>
</body>
</html>
