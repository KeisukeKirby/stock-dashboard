<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VFF Stock Dashboard</title>
  <meta name="description" content="VFF shoes stock dashboard by store and office">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233b82c4'/><rect x='7' y='16' width='4' height='9' rx='1.5' fill='white'/><rect x='14' y='10' width='4' height='15' rx='1.5' fill='white'/><rect x='21' y='13' width='4' height='12' rx='1.5' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202609291231">
</head>
<body>
  <div class="page">
    <header class="top">
      <div>
        <p class="eyebrow">Store Stock Dashboard</p>
        <h1 data-i18n="h1"></h1>
        <p class="sub"><span id="asof" data-i18n="loading"></span><span class="dot">·</span><span id="source"></span></p>
        <p class="alloc-note" id="allocNote" hidden></p>
      </div>
      <div class="top-actions">
        <a id="dlXlsx" class="ghost" href="source.xlsx" download data-i18n="dl.store"></a>
        <a id="dlOffice" class="ghost" href="source_office.xlsx" download hidden data-i18n="dl.office"></a>
        <div class="lang-switch" role="group" data-i18n-aria="lang.aria">
          <button type="button" data-lang="ja" lang="ja">日本語</button>
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="th" lang="th">ไทย</button>
        </div>
        <button id="themeToggle" class="ghost" type="button" data-i18n-aria="theme.aria">
          <span aria-hidden="true">◐</span> <span id="themeLabel"></span>
        </button>
      </div>
    </header>

    <nav class="tabs" role="tablist" data-i18n-aria="tabs.aria">
      <button class="tab" role="tab" id="tab-table" data-view="table" aria-controls="view-table" data-i18n="tab.table"></button>
      <button class="tab" role="tab" id="tab-detail" data-view="detail" aria-controls="view-detail" data-i18n="tab.detail"></button>
    </nav>

    <section id="view-detail" class="view" role="tabpanel" aria-labelledby="tab-detail" hidden>
    <p class="view-note" id="detailNote"></p>
    <section class="kpis" data-i18n-aria="kpi.aria">
      <div class="kpi">
        <p class="kpi-label" data-i18n="kpi.total"></p>
        <p class="kpi-value" id="kpiTotal">–</p>
        <p class="kpi-note" id="kpiTotalNote"></p>
      </div>
      <div class="kpi">
        <p class="kpi-label" data-i18n="kpi.sku"></p>
        <p class="kpi-value" id="kpiSku">–</p>
        <p class="kpi-note" id="kpiSkuNote"></p>
      </div>
      <button class="kpi kpi-btn" id="kpiOutBtn" type="button" aria-pressed="false">
        <span class="kpi-label"><span class="status-ic crit" aria-hidden="true">●</span><span data-i18n="kpi.out"></span></span>
        <span class="kpi-value" id="kpiOut">–</span>
        <span class="kpi-note" data-i18n="kpi.outNote"></span>
      </button>
      <button class="kpi kpi-btn" id="kpiLowBtn" type="button" aria-pressed="false">
        <span class="kpi-label"><span class="status-ic warn" aria-hidden="true">▲</span><span data-i18n="kpi.low"></span></span>
        <span class="kpi-value" id="kpiLow">–</span>
        <span class="kpi-note" data-i18n="kpi.lowNote"></span>
      </button>
    </section>

    <section class="charts">
      <div class="card">
        <div class="card-head">
          <h2 data-i18n="chart.loc"></h2>
          <p class="hint" data-i18n="chart.locHint"></p>
        </div>
        <div id="storeChart" class="bars"></div>
      </div>
      <div class="card">
        <div class="card-head">
          <h2 data-i18n="chart.model"></h2>
          <p class="hint" data-i18n="chart.modelHint"></p>
        </div>
        <div id="modelChart" class="bars compact"></div>
      </div>
    </section>
    </section>

    <section id="view-table" class="view card table-card" role="tabpanel" aria-labelledby="tab-table">
      <div class="card-head">
        <h2><span data-i18n="list.title"></span> <span class="count" id="rowCount"></span></h2>
        <div class="head-actions">
          <span id="retInfo" class="ret-info"></span>
          <span id="syncState" class="sync-state"></span>
          <span id="saveState" class="save-state" aria-live="polite"></span>
          <button id="saveReturns" class="primary small" type="button" disabled data-i18n-title="save.title" data-i18n="save"></button>
          <button id="revertReturns" class="ghost small" type="button" hidden data-i18n="revert"></button>
          <button id="clearReturns" class="ghost small" type="button" hidden data-i18n="clear"></button>
          <button id="dlXlsxOut" class="ghost small" type="button" data-i18n-title="xlsx.title" data-i18n="xlsx"></button>
          <button id="dlCsv" class="ghost small" type="button" data-i18n="csv"></button>
        </div>
      </div>

      <div class="filters" role="search">
        <label class="field grow">
          <span data-i18n="f.search"></span>
          <input id="q" type="search" data-i18n-ph="f.searchPh" autocomplete="off">
        </label>
        <div class="field">
          <span data-i18n="f.model"></span>
          <button type="button" class="ms" id="fModel" data-af="tmodel" aria-haspopup="dialog"><span class="ms-val"></span><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5h6L5 7z"/></svg></button>
        </div>
        <div class="field">
          <span data-i18n="f.color"></span>
          <button type="button" class="ms" id="fColor" data-af="tcolor" aria-haspopup="dialog"><span class="ms-val"></span><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5h6L5 7z"/></svg></button>
        </div>
        <div class="field">
          <span data-i18n="f.size"></span>
          <button type="button" class="ms" id="fSize" data-af="tsize" aria-haspopup="dialog"><span class="ms-val"></span><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5h6L5 7z"/></svg></button>
        </div>
        <label class="field">
          <span data-i18n="f.stock"></span>
          <select id="fStock">
            <option value="" data-i18n="f.all"></option>
            <option value="in" data-i18n="f.in"></option>
            <option value="low" data-i18n="f.low"></option>
            <option value="out" data-i18n="f.out"></option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="f.sort"></span>
          <select id="fSort"><option value="" data-i18n="f.sortExcel"></option></select>
        </label>
        <button id="reset" class="ghost" type="button" data-i18n="reset"></button>
      </div>

      <p class="ret-hint" data-i18n-html="retHint"></p>
      <p class="af-hint" data-i18n-html="af.hint"></p>
      <p class="af-hint" data-i18n-html="sel.hint"></p>
      <div id="activeFilters" class="chips" hidden></div>

      <!-- ここから下は Excel「VFF Shoes Stock」シートと同じ書式 -->
      <div class="sheet" id="sheet">
        <table id="stockTable">
          <colgroup id="cols"></colgroup>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <footer class="foot" id="foot"></footer>
  </div>

  <div id="tip" class="tip" role="tooltip" hidden></div>
  <div id="afPop" class="af-pop" role="dialog" hidden></div>
  <div id="selBar" class="sel-bar" role="status" aria-live="polite" hidden>
    <span class="sel-num"><span data-i18n="sel.sum"></span>: <b id="selSum"></b></span>
    <span class="sel-num"><span data-i18n="sel.avg"></span>: <b id="selAvg"></b></span>
    <span><span data-i18n="sel.filled"></span>: <b id="selFilled"></b></span>
    <span class="sel-num"><span data-i18n="sel.count"></span>: <b id="selCount"></b></span>
    <span><span data-i18n="sel.rows"></span>: <b id="selRows"></b></span>
    <span class="sel-size" id="selSize"></span>
    <span class="sel-copy" data-i18n="sel.copyHint"></span>
    <button type="button" id="selClose" aria-label="×">×</button>
  </div>
  <script src="i18n.js?v=202609291231"></script>
  <script src="app.js?v=202609291231"></script>
</body>
</html>
