<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>店舗在庫ダッシュボード</title>
  <meta name="description" content="VFF シューズの店舗別在庫ダッシュボード（在庫表は Excel と同じ書式）">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233b82c4'/><rect x='7' y='16' width='4' height='9' rx='1.5' fill='white'/><rect x='14' y='10' width='4' height='15' rx='1.5' fill='white'/><rect x='21' y='13' width='4' height='12' rx='1.5' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <div>
        <p class="eyebrow">Store Stock Dashboard</p>
        <h1>店舗在庫ダッシュボード</h1>
        <p class="sub"><span id="asof">読み込み中…</span><span class="dot">·</span><span id="source"></span></p>
      </div>
      <div class="top-actions">
        <a id="dlXlsx" class="ghost" href="source.xlsx" download>元の Excel をダウンロード</a>
        <button id="themeToggle" class="ghost" type="button" aria-label="表示モード切替">
          <span aria-hidden="true">◐</span> <span id="themeLabel">自動</span>
        </button>
      </div>
    </header>

    <section class="kpis" aria-label="サマリー">
      <div class="kpi">
        <p class="kpi-label">総在庫数</p>
        <p class="kpi-value" id="kpiTotal">–</p>
        <p class="kpi-note" id="kpiTotalNote"></p>
      </div>
      <div class="kpi">
        <p class="kpi-label">SKU 数</p>
        <p class="kpi-value" id="kpiSku">–</p>
        <p class="kpi-note" id="kpiSkuNote"></p>
      </div>
      <button class="kpi kpi-btn" id="kpiOutBtn" type="button" aria-pressed="false">
        <span class="kpi-label"><span class="status-ic crit" aria-hidden="true">●</span>全店在庫切れ</span>
        <span class="kpi-value" id="kpiOut">–</span>
        <span class="kpi-note">合計 0 の SKU — クリックで一覧に表示</span>
      </button>
      <button class="kpi kpi-btn" id="kpiLowBtn" type="button" aria-pressed="false">
        <span class="kpi-label"><span class="status-ic warn" aria-hidden="true">▲</span>残りわずか</span>
        <span class="kpi-value" id="kpiLow">–</span>
        <span class="kpi-note">合計 1 点の SKU — クリックで一覧に表示</span>
      </button>
    </section>

    <section class="charts">
      <div class="card">
        <div class="card-head">
          <h2>店舗別の在庫数</h2>
          <p class="hint">クリックでその店舗の在庫が多い順に並び替え</p>
        </div>
        <div id="storeChart" class="bars"></div>
      </div>
      <div class="card">
        <div class="card-head">
          <h2>モデル別の在庫数</h2>
          <p class="hint">クリックでそのモデルに絞り込み</p>
        </div>
        <div id="modelChart" class="bars compact"></div>
      </div>
    </section>

    <section class="card table-card">
      <div class="card-head">
        <h2>在庫一覧 <span class="count" id="rowCount"></span></h2>
        <button id="dlCsv" class="ghost small" type="button">表示中の行を CSV で保存</button>
      </div>

      <div class="filters" role="search">
        <label class="field grow">
          <span>検索</span>
          <input id="q" type="search" placeholder="コード・モデル・カラー・サイズ" autocomplete="off">
        </label>
        <label class="field">
          <span>モデル</span>
          <select id="fModel"><option value="">すべて</option></select>
        </label>
        <label class="field">
          <span>カラー</span>
          <select id="fColor"><option value="">すべて</option></select>
        </label>
        <label class="field">
          <span>サイズ</span>
          <select id="fSize"><option value="">すべて</option></select>
        </label>
        <label class="field">
          <span>在庫</span>
          <select id="fStock">
            <option value="">すべて</option>
            <option value="in">在庫あり</option>
            <option value="low">残りわずか (1点)</option>
            <option value="out">在庫切れ (0点)</option>
          </select>
        </label>
        <label class="field">
          <span>並び順</span>
          <select id="fSort"><option value="">Excel と同じ</option></select>
        </label>
        <button id="reset" class="ghost" type="button">条件をリセット</button>
      </div>

      <!-- ここから下は Excel「VFF Shoes Stock」シートと同じ書式 -->
      <div class="sheet" id="sheet">
        <table id="stockTable">
          <colgroup id="cols"></colgroup>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <footer class="foot">
      データ元: <span id="footSource"></span> — 数値は Excel 保存時の計算結果です。絞り込み中の Total 行は表示中の行の合計です。
    </footer>
  </div>

  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
