<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VFF Shoe Inventory</title>
  <meta name="description" content="VFF シューズの店舗別在庫一覧（Store_Stock Excel と同じレイアウト）">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%231F4E78'/><rect x='6' y='9' width='20' height='3' fill='white'/><rect x='6' y='15' width='20' height='2' fill='%23D9D9D9'/><rect x='6' y='20' width='20' height='2' fill='%23D9D9D9'/><rect x='20' y='14' width='6' height='9' fill='%23FFF2CC'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toolbar" role="search">
    <label class="field grow">
      <span>検索</span>
      <input id="q" type="search" placeholder="コード・モデル・カラー・サイズ" autocomplete="off">
    </label>
    <label class="field">
      <span>モデル</span>
      <select id="fModel"><option value="">すべて</option></select>
    </label>
    <label class="field">
      <span>カラー</span>
      <select id="fColor"><option value="">すべて</option></select>
    </label>
    <label class="field">
      <span>サイズ</span>
      <select id="fSize"><option value="">すべて</option></select>
    </label>
    <label class="field">
      <span>在庫</span>
      <select id="fStock">
        <option value="">すべて</option>
        <option value="in">在庫あり</option>
        <option value="low">残りわずか (1点)</option>
        <option value="out">在庫切れ (0点)</option>
      </select>
    </label>
    <button id="reset" type="button">条件をリセット</button>
    <span id="rowCount" class="count"></span>
  </div>
  <div class="sheet" id="sheet">
    <table id="stockTable">
      <colgroup id="cols"></colgroup>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
    <p id="status" class="status">読み込み中…</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
