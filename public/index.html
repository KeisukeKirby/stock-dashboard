<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VFF Stock Dashboard</title>
  <meta name="description" content="VFF shoes stock dashboard by store and office">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233b82c4'/><rect x='7' y='16' width='4' height='9' rx='1.5' fill='white'/><rect x='14' y='10' width='4' height='15' rx='1.5' fill='white'/><rect x='21' y='13' width='4' height='12' rx='1.5' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261128145833">
</head>
<body>
  <div class="page">
    <header class="top">
      <div>
        <p class="eyebrow">Store Stock Dashboard</p>
        <h1 data-i18n="h1"></h1>
        <p class="sub"><span id="asof" data-i18n="loading"></span><span class="dot">·</span><span id="source"></span></p>
        <p id="zortWarn" class="zort-warn" role="status" hidden></p>
      </div>
      <div class="top-actions">
        <a class="ghost" href="vivo">Vivo Sales →</a>
        <a id="dlXlsx" class="ghost" href="source.xlsx" download data-i18n="dl.store"></a>
        <a id="dlOffice" class="ghost" href="source_office.xlsx" download hidden data-i18n="dl.office"></a>
        <div class="lang-switch" role="group" data-i18n-aria="lang.aria">
          <button type="button" data-lang="ja" lang="ja">日本語</button>
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="th" lang="th">ไทย</button>
        </div>
        <button id="themeToggle" class="ghost" type="button" data-i18n-aria="theme.aria">
          <span aria-hidden="true">◐</span> <span id="themeLabel"></span>
        </button>
      </div>
    </header>

    <nav class="tabs" role="tablist" data-i18n-aria="tabs.aria">
      <button class="tab" role="tab" id="tab-table" data-view="table" aria-controls="view-table" data-i18n="tab.table"></button>
      <button class="tab" role="tab" id="tab-detail" data-view="detail" aria-controls="view-detail" data-i18n="tab.detail"></button>
    </nav>

    <section id="view-detail" class="view" role="tabpanel" aria-labelledby="tab-detail" hidden>
    <p class="view-note" id="detailNote"></p>
    <section class="kpis" data-i18n-aria="kpi.aria">
      <div class="kpi">
        <p class="kpi-label" data-i18n="kpi.total"></p>
        <p class="kpi-value" id="kpiTotal">–</p>
        <p class="kpi-note" id="kpiTotalNote"></p>
      </div>
      <div class="kpi">
        <p class="kpi-label" data-i18n="kpi.sku"></p>
        <p class="kpi-value" id="kpiSku">–</p>
        <p class="kpi-note" id="kpiSkuNote"></p>
      </div>
      <button class="kpi kpi-btn" id="kpiOutBtn" type="button" aria-pressed="false">
        <span class="kpi-label"><span class="status-ic crit" aria-hidden="true">●</span><span data-i18n="kpi.out"></span></span>
        <span class="kpi-value" id="kpiOut">–</span>
        <span class="kpi-note" data-i18n="kpi.outNote"></span>
      </button>
      <button class="kpi kpi-btn" id="kpiLowBtn" type="button" aria-pressed="false">
        <span class="kpi-label"><span class="status-ic warn" aria-hidden="true">▲</span><span data-i18n="kpi.low"></span></span>
        <span class="kpi-value" id="kpiLow">–</span>
        <span class="kpi-note" data-i18n="kpi.lowNote"></span>
      </button>
    </section>

    <section class="card guide">
      <p class="alloc-note" id="allocNote" hidden></p>
      <h2 data-i18n="guide.title"></h2>
      <ul class="guide-list">
        <li data-i18n-html="retHint"></li>
        <li data-i18n-html="af.hint"></li>
        <li data-i18n-html="sel.hint"></li>
      </ul>
    </section>

    <section class="charts">
      <div class="card">
        <div class="card-head">
          <h2 data-i18n="chart.loc"></h2>
          <p class="hint" data-i18n="chart.locHint"></p>
        </div>
        <div id="storeChart" class="bars"></div>
      </div>
      <div class="card">
        <div class="card-head">
          <h2 data-i18n="chart.model"></h2>
          <p class="hint" data-i18n="chart.modelHint"></p>
        </div>
        <div id="modelChart" class="bars compact"></div>
      </div>
    </section>
    </section>

    <section id="view-table" class="view card table-card" role="tabpanel" aria-labelledby="tab-table">
      <div class="card-head">
        <h2><span class="brand-switch" role="group"><button type="button" class="on" data-view="table">VFF</button><button type="button" data-view="vivo">Vivo</button><button type="button" data-view="socks">Socks</button><button type="button" data-view="oleno">Oleno</button><button type="button" data-view="coolcore">Coolcore</button><button type="button" data-view="zero" data-i18n="zero.btn"></button></span><span data-i18n="list.title"></span> <span class="count" id="rowCount"></span></h2>
        <div class="head-actions">
          <span id="retInfo" class="ret-info"></span>
          <span id="syncState" class="sync-state"></span>
          <span id="saveState" class="save-state" aria-live="polite"></span>
          <button id="receiveReturns" class="recv-btn small" type="button" hidden data-i18n-title="recv.btnTitle"></button>
          <button id="saveReturns" class="primary small" type="button" disabled data-i18n-title="save.title" data-i18n="save"></button>
          <button id="revertReturns" class="ghost small" type="button" hidden data-i18n="revert"></button>
          <button id="clearReturns" class="ghost small" type="button" hidden data-i18n="clear"></button>
          <span class="ord-actions" role="group" aria-label="Order">
            <span id="ordInfo" class="ord-info"></span>
            <span id="ordState" class="sync-state ord-state" aria-live="polite"></span>
            <button id="saveOrders" class="primary small" type="button" disabled data-i18n="ord.save" data-i18n-title="ord.saveTitle"></button>
            <button id="confirmOrders" class="ord-confirm small" type="button" disabled data-i18n="ord.confirmBtn" data-i18n-title="ord.confirmTitle"></button>
            <button id="revertOrders" class="ghost small" type="button" hidden data-i18n="revert"></button>
            <button id="ordHistBtn" class="ghost small" type="button" hidden data-i18n="ord.history"></button>
          </span>
          <button id="dlXlsxOut" class="ghost small" type="button" data-i18n-title="xlsx.title" data-i18n="xlsx"></button>
          <button id="dlCsv" class="ghost small" type="button" data-i18n="csv"></button>
        </div>
      </div>

      <div class="filters" role="search">
        <label class="field grow">
          <span data-i18n="f.search"></span>
          <input id="q" type="search" data-i18n-ph="f.searchPh" autocomplete="off">
        </label>
        <div class="field">
          <span data-i18n="f.loc"></span>
          <button type="button" class="ms" id="fLoc" data-af="loc" aria-haspopup="dialog"><span class="ms-val"></span><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5h6L5 7z"/></svg></button>
        </div>
        <div class="field">
          <span data-i18n="f.model"></span>
          <button type="button" class="ms" id="fModel" data-af="tmodel" aria-haspopup="dialog"><span class="ms-val"></span><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5h6L5 7z"/></svg></button>
        </div>
        <div class="field">
          <span data-i18n="f.color"></span>
          <button type="button" class="ms" id="fColor" data-af="tcolor" aria-haspopup="dialog"><span class="ms-val"></span><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5h6L5 7z"/></svg></button>
        </div>
        <div class="field">
          <span data-i18n="f.size"></span>
          <button type="button" class="ms" id="fSize" data-af="tsize" aria-haspopup="dialog"><span class="ms-val"></span><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5h6L5 7z"/></svg></button>
        </div>
        <label class="field">
          <span data-i18n="f.stock"></span>
          <select id="fStock">
            <option value="" data-i18n="f.all"></option>
            <option value="in" data-i18n="f.in"></option>
            <option value="low" data-i18n="f.low"></option>
            <option value="out" data-i18n="f.out"></option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="f.sort"></span>
          <select id="fSort"><option value="" data-i18n="f.sortExcel"></option></select>
        </label>
        <button type="button" class="seg-btn" id="detailsToggle" aria-pressed="false" data-i18n-title="details.title"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v2H2zm0 4h12v2H2zm0 4h8v2H2z"/></svg><span></span></button>
        <label class="switch"><input type="checkbox" id="heatToggle"><span class="switch-ui" aria-hidden="true"></span><span data-i18n="heat.toggle"></span></label>
        <span class="plan-tol" title="" data-i18n-title="plan.tolTitle"><span data-i18n="plan.tol"></span> <label>±<input type="number" id="tolPct" min="0" max="50" step="0.5" value="2">%</label> <label>±<input type="number" id="tolQty" min="0" max="100" step="1" value="0"><span data-i18n="plan.pairs"></span></label></span>
        <label class="check-toggle" id="rateToggle" hidden><input type="checkbox" id="showRate" checked> <span data-i18n="rate.toggle"></span></label>
        <button id="reset" class="ghost" type="button" data-i18n="reset"></button>
      </div>

      <div id="activeFilters" class="chips" hidden></div>

      <!-- ここから下は Excel「VFF Shoes Stock」シートと同じ書式 -->
      <div class="sheet" id="sheet">
        <table id="stockTable">
          <colgroup id="cols"></colgroup>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <section id="view-vivo" class="view card table-card" role="tabpanel" aria-labelledby="tab-table" hidden>
      <div class="card-head">
        <h2><span class="brand-switch" role="group"><button type="button" data-view="table">VFF</button><button type="button" class="on" data-view="vivo">Vivo</button><button type="button" data-view="socks">Socks</button><button type="button" data-view="oleno">Oleno</button><button type="button" data-view="coolcore">Coolcore</button><button type="button" data-view="zero" data-i18n="zero.btn"></button></span><span data-i18n="vivo.title"></span> <span class="count" id="vCount"></span></h2>
      </div>
      <div class="filters" role="search">
        <label class="field grow"><span data-i18n="f.search"></span><input id="vq" type="search" data-i18n-ph="f.searchPh" autocomplete="off"></label>
        <label class="check-toggle"><input type="checkbox" id="vStock"> <span data-i18n="vivo.onlyStock"></span></label>
      </div>
      <p class="af-hint" id="vNote"></p>
      <div class="sheet vivo-sheet">
        <table id="vivoTable"><thead id="vThead"></thead><tbody id="vTbody"></tbody></table>
      </div>
    </section>
    <section id="view-socks" class="view card table-card" role="tabpanel" aria-labelledby="tab-table" hidden>
      <div class="card-head">
        <h2><span class="brand-switch" role="group"><button type="button" data-view="table">VFF</button><button type="button" data-view="vivo">Vivo</button><button type="button" class="on" data-view="socks">Socks</button><button type="button" data-view="oleno">Oleno</button><button type="button" data-view="coolcore">Coolcore</button><button type="button" data-view="zero" data-i18n="zero.btn"></button></span><span data-i18n="socks.title"></span> <span class="count" id="sCount"></span></h2>
      </div>
      <div class="filters" role="search">
        <label class="field grow"><span data-i18n="f.search"></span><input id="sq" type="search" data-i18n-ph="f.searchPh" autocomplete="off"></label>
        <label class="check-toggle"><input type="checkbox" id="sStock"> <span data-i18n="vivo.onlyStock"></span></label>
      </div>
      <p class="af-hint" id="sNote"></p>
      <div class="sheet vivo-sheet">
        <table id="socksTable"><thead id="sThead"></thead><tbody id="sTbody"></tbody></table>
      </div>
    </section>
    <section id="view-oleno" class="view card table-card" role="tabpanel" aria-labelledby="tab-table" hidden>
      <div class="card-head">
        <h2><span class="brand-switch" role="group"><button type="button" data-view="table">VFF</button><button type="button" data-view="vivo">Vivo</button><button type="button" data-view="socks">Socks</button><button type="button" class="on" data-view="oleno">Oleno</button><button type="button" data-view="coolcore">Coolcore</button><button type="button" data-view="zero" data-i18n="zero.btn"></button></span><span data-i18n="oleno.title"></span> <span class="count" id="oCount"></span></h2>
      </div>
      <div class="filters" role="search">
        <label class="field grow"><span data-i18n="f.search"></span><input id="oq" type="search" data-i18n-ph="f.searchPh" autocomplete="off"></label>
        <label class="check-toggle"><input type="checkbox" id="oStock"> <span data-i18n="vivo.onlyStock"></span></label>
      </div>
      <p class="af-hint" id="oNote"></p>
      <div class="sheet vivo-sheet">
        <table id="olenoTable"><thead id="oThead"></thead><tbody id="oTbody"></tbody></table>
      </div>
    </section>
    <section id="view-coolcore" class="view card table-card" role="tabpanel" aria-labelledby="tab-table" hidden>
      <div class="card-head">
        <h2><span class="brand-switch" role="group"><button type="button" data-view="table">VFF</button><button type="button" data-view="vivo">Vivo</button><button type="button" data-view="socks">Socks</button><button type="button" data-view="oleno">Oleno</button><button type="button" class="on" data-view="coolcore">Coolcore</button><button type="button" data-view="zero" data-i18n="zero.btn"></button></span><span data-i18n="coolcore.title"></span> <span class="count" id="cCount"></span></h2>
      </div>
      <div class="filters" role="search">
        <label class="field grow"><span data-i18n="f.search"></span><input id="cq" type="search" data-i18n-ph="f.searchPh" autocomplete="off"></label>
        <label class="check-toggle"><input type="checkbox" id="cStock"> <span data-i18n="vivo.onlyStock"></span></label>
      </div>
      <p class="af-hint" id="cNote"></p>
      <div class="sheet vivo-sheet">
        <table id="coolcoreTable"><thead id="cThead"></thead><tbody id="cTbody"></tbody></table>
      </div>
    </section>
    <section id="view-zero" class="view card table-card" role="tabpanel" aria-labelledby="tab-table" hidden>
      <div class="card-head">
        <h2><span class="brand-switch" role="group"><button type="button" data-view="table">VFF</button><button type="button" data-view="vivo">Vivo</button><button type="button" data-view="socks">Socks</button><button type="button" data-view="oleno">Oleno</button><button type="button" data-view="coolcore">Coolcore</button><button type="button" class="on" data-view="zero" data-i18n="zero.btn"></button></span><span data-i18n="zero.title"></span> <span class="count" id="zCount"></span></h2>
      </div>
      <div class="filters" role="search">
        <label class="field grow"><span data-i18n="f.search"></span><input id="zq" type="search" data-i18n-ph="f.searchPh" autocomplete="off"></label>
      </div>
      <p class="af-hint" id="zNote"></p>
      <div class="sheet vivo-sheet">
        <table id="zeroTable"><thead id="zThead"></thead><tbody id="zTbody"></tbody></table>
      </div>
    </section>

    <footer class="foot" id="foot"></footer>
  </div>

  <dialog id="recvDlg" class="recv-dlg" aria-labelledby="recvTitle">
    <form method="dialog" class="recv-inner">
      <div class="recv-head">
        <h2 id="recvTitle" data-i18n="recv.title"></h2>
        <button type="submit" class="recv-x" aria-label="×">×</button>
      </div>
      <p class="recv-note" data-i18n="recv.note"></p>
      <p class="recv-warn" id="recvWarn" hidden></p>
      <div id="recvBody" class="recv-body"></div>
      <div class="recv-foot" id="recvFoot">
        <span id="recvSel" class="recv-sel"></span>
        <button type="button" id="recvDo" class="primary" disabled></button>
      </div>
    </form>
  </dialog>
  <dialog id="clearDlg" class="clear-dlg" aria-labelledby="clearTitle">
    <form method="dialog">
      <p id="clearTitle" class="clear-msg" data-i18n="drawer.clearAsk"></p>
      <p class="clear-sub" id="clearSub"></p>
      <div class="clear-btns"><button value="no" class="ghost" data-i18n="drawer.no"></button><button value="yes" class="danger" data-i18n="drawer.yes"></button></div>
    </form>
  </dialog>
  <dialog id="confirmDlg" class="clear-dlg" aria-labelledby="confirmTitle">
    <form method="dialog">
      <p id="confirmTitle" class="clear-msg" data-i18n="ord.confirmAsk"></p>
      <p class="clear-sub" id="confirmSub"></p>
      <label class="name-field"><span data-i18n="ord.nameLabel"></span><input id="ordName" type="text" maxlength="100" autocomplete="off"></label>
      <div class="clear-btns"><button value="no" class="ghost" data-i18n="drawer.no"></button><button value="yes" class="confirm-yes" data-i18n="ord.confirmBtn"></button></div>
    </form>
  </dialog>
  <dialog id="ordDlg" class="recv-dlg" aria-labelledby="ordTitle">
    <form method="dialog" class="recv-inner">
      <div class="recv-head">
        <h2 id="ordTitle" data-i18n="ord.historyTitle"></h2>
        <button type="submit" class="recv-x" aria-label="×">×</button>
      </div>
      <p class="recv-note" data-i18n="ord.historyNote"></p>
      <div id="ordBody" class="recv-body"></div>
    </form>
  </dialog>
  <div id="rowBar" class="row-bar" role="status" hidden>
    <b id="rowBarN"></b>
    <button type="button" id="rowCopy" class="ghost small" data-i18n="rows.copy"></button>
    <button type="button" id="rowCsv" class="ghost small">CSV</button>
    <button type="button" id="rowClear" class="ghost small" data-i18n="rows.clear"></button>
  </div>
  <button type="button" id="ordFab" class="ord-fab" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l5 5v15H6zM14 3v5h5M9 12h8M9 16h8"/></svg><span data-i18n="drawer.btn"></span><b id="ordFabN"></b></button>
  <aside id="ordDrawer" class="ord-drawer" hidden aria-labelledby="drawerTitle">
    <div class="drawer-head"><h2 id="drawerTitle" data-i18n="drawer.title"></h2><button type="button" id="drawerClose" class="drawer-close" aria-label="×">×</button></div>
    <p class="drawer-note" data-i18n="drawer.note"></p>
    <div class="drawer-body"><table class="drawer-table"><thead><tr><th>Model</th><th>Color</th><th>Size</th><th>Qty</th><th></th></tr></thead><tbody id="drawerList"></tbody></table></div>
    <div class="drawer-foot">
      <div class="drawer-total" id="drawerTotal"></div>
      <div class="drawer-state"><span id="drawerState"></span></div>
      <button type="button" id="drawerSave" class="drawer-save" data-i18n="ord.save"></button>
      <button type="button" id="drawerConfirm" class="drawer-confirm" data-i18n="ord.confirmBtn"></button>
      <button type="button" id="drawerHist" class="ghost small" data-i18n="ord.history"></button>
      <button type="button" id="drawerXlsx" class="ghost small" data-i18n="drawer.xlsx"></button>
      <button type="button" id="drawerClear" class="drawer-clear" data-i18n="drawer.clear"></button>
    </div>
  </aside>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <div id="afPop" class="af-pop" role="dialog" hidden></div>
  <div id="selBar" class="sel-bar" role="status" aria-live="polite" hidden>
    <span class="sel-num"><span data-i18n="sel.sum"></span>: <b id="selSum"></b></span>
    <span class="sel-num"><span data-i18n="sel.avg"></span>: <b id="selAvg"></b></span>
    <span><span data-i18n="sel.filled"></span>: <b id="selFilled"></b></span>
    <span class="sel-num"><span data-i18n="sel.count"></span>: <b id="selCount"></b></span>
    <span><span data-i18n="sel.rows"></span>: <b id="selRows"></b></span>
    <span class="sel-size" id="selSize"></span>
    <span class="sel-copy" data-i18n="sel.copyHint"></span>
    <button type="button" id="selClose" aria-label="×">×</button>
  </div>
  <script src="zort.js?v=20261128145833"></script>
  <script src="i18n.js?v=20261128145833"></script>
  <script src="sheet-common.js?v=20261128145833"></script>
  <script src="vivo-stock.js?v=20261128145833"></script>
  <script src="socks-stock.js?v=20261128145833"></script>
  <script src="app.js?v=20261128145833"></script>
</body>
</html>
